<script>
document.addEventListener("mouseover", function(e){
  var el = e.target.closest && e.target.closest(".svb-brand");
  if (!el || el.classList.contains("flash")) return;
  el.classList.add("flash");
  var done = function(){ el.classList.remove("flash"); el.removeEventListener("animationend", done); };
  el.addEventListener("animationend", done);
  setTimeout(done, 900);
}, true);
</script>
